world:
  map: "Town06_Opt"
#  action_repeat: 10   # 每10帧做一次决策，模拟真实

obs_type: ["idc_obs"]   # "image", "measurements"，"idc_obs"

traffic:
  enable_sumo: False  # 是否启用sumo交通，如果启用则actors-num_vehicles配置不生效

actors:
  others:
    num_vehicles: 0
  ego:
    ego_car_type: 'vehicle.tesla.model3'
    random_place: False # 是否随机放置自车（非sumo模式下有效）
    ref_speed: 10.0  # 参考速度m/s（训练初期使用5 m/s以稳定学习）
    perceived_distance: 20.0  # 感知周车距离

image:
  width: 200
  height: 88
  channels: 3
  fov: 100

measurements:
  include: ["speed", "steer", "compass", "gps", "imu"]  # 速度（x,y),转向（steer）,方向弧度，

# idc观察模式
idc:
  include: ["ego", "others", "ref_error"]
  num_points: 20  # 道路边缘点数量
  others: 8 # 周车数量

action:
  type: "continuous"
  continuous:
    throttle_range: [-3.0, 1.5]
    steer_range: [-0.4, 0.4]

reward_weights:
  speed: 2.0
  low_speed_penalty: 10
  centering: 1.0
  collision: -100.0
  angle: 0.01
  obstacle: -100.0

termination:
  collision_threshold: 0.1
  max_episode_steps: 512     # 每回合最大步数
  obstacle_threshold: 1.5
